    <meta name="description" content="Gratis lånekalkulator for boliglån, startlån, billån og studielån. Se hva ekstra innbetalinger, avdragsfrihet og renteendringer gjør med lånet ditt." />

    <link rel="canonical" href="https://lane-kalkulator.pladsen.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lånekalkulator" />
    <meta property="og:locale" content="nb_NO" />
    <meta property="og:url" content="https://lane-kalkulator.pladsen.dev/" />
    <meta property="og:title" content="Lånekalkulator – ekstra nedbetaling, avdragsfrihet og rente" />
    <meta property="og:description" content="Gratis lånekalkulator for boliglån, startlån, billån og studielån. Se hva ekstra innbetalinger, avdragsfrihet og renteendringer gjør med lånet ditt." />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the stored theme before first paint so dark-mode users get no light flash.
      (function () {
        try {
          var t = localStorage.getItem("lane-kalkulator:theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var l = localStorage.getItem("lane-kalkulator:lang");
          if (l === "nb" || l === "en" || l === "pl") document.documentElement.lang = l;
          else document.documentElement.lang = "nb";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
