<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1f1d" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Se hva ekstrabetalinger, avdragsfrihet og renteendringer egentlig gjør med lånet ditt. Privat: lånedataene dine forlater aldri nettleseren." />
    <title>Lånekalkulator</title>
    <script>
      // Apply the stored theme before first paint so dark-mode users get no light flash.
      (function () {
        try {
          var t = localStorage.getItem("lane-kalkulator:theme");
          var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var l = localStorage.getItem("lane-kalkulator:lang");
          if (l === "nb" || l === "en" || l === "pl") document.documentElement.lang = l;
          else document.documentElement.lang = "nb";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
